<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

<!-- SEO Principal -->

<meta name="keywords" content="painel de revenda, revender,, recargas play, revenda de players"/>

<!-- Open Graph / Redes Sociais (WhatsApp, Facebook, Telegram) -->
<meta property="og:type" content="website"/>
<meta property="og:title" content="Painel de Revenda IPTV e Créditos | Recargas Play"/>
<meta property="og:description" content="Torne-se um revendedor de IPTV de sucesso. Compre créditos com agilidade, painel estável e suporte dedicado."/>
<meta property="og:url" content="https://recargasplay.com.br/"/>
<meta property="og:image" content="https://recargasplay.com.br/logo.png"/>

<!-- Favicon e Recursos -->
<link href="../favicon.png" rel="icon" type="image/png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }

        #container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <script>
        (function() {
            const targetUrl = "https://painel.recargasplaybr.workers.dev/auth";

            // Cria o HTML interno do Blob com estilos de tela cheia
            const pageContent = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <iframe src="${targetUrl}" title="Painel de Revenda"></iframe>
</body>
</html>`;

            const blob = new Blob([pageContent], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);

            // Cria o iframe externo apontando para o Blob (o inspecionador mostrará o blob:)
            const iframe = document.createElement('iframe');
            iframe.src = blobUrl;
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.style.display = 'block';
            iframe.title = 'Painel de Revenda';

            document.getElementById('container').appendChild(iframe);
        })();
    </script>

</body>
</html>
